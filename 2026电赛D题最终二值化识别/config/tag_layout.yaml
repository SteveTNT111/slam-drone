tag_family: tag36h11

# A tag may always be detected and its own pose displayed when its measured
# black detection-border size is known. It may infer the platform center only
# when BOTH enabled and measured_layout are true.
#
# position_platform_m and rpy_platform_tag_deg define T_platform_tag:
# tag pose expressed in the platform frame. The detector computes
# T_camera_platform = T_camera_tag * inverse(T_platform_tag).
tags:
  "9":
    enabled: false
    measured_layout: false
    black_border_size_m: 0.15
    position_platform_m: [0.0, 0.0, 0.0]
    rpy_platform_tag_deg: [0.0, 0.0, 0.0]
